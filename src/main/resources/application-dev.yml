spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/meubanco}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:secretpassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

locadora:
  dado-pessoal:
    indice-chave: ${LOCADORA_DADO_PESSOAL_INDICE_CHAVE}
    cifra-chave: ${LOCADORA_DADO_PESSOAL_CIFRA_CHAVE}
