spring.application.name=aluguel

# --- Datasource -------------------------------------------------------------
# Os valores padrao apontam para localhost (execucao local). No Docker o
# SPRING_DATASOURCE_URL sobrescreve para o host do container do Postgres.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/meubanco}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secretpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate --------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# show-sql fica desligado por padrao: o SQL e emitido pelo log do Hibernate.
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
logging.level.org.hibernate.SQL=DEBUG

# Nao segura sessao aberta durante a serializacao: os services ja devolvem DTO,
# entao nao existe acesso lazy fora de transacao.
spring.jpa.open-in-view=false

# --- Seguranca / LGPD ------------------------------------------------------
# Chaves de protecao dos dados pessoais (CPF, CNH, nome, e-mail, telefone,
# placa, observacoes). Nao ha valor padrao de proposito: um default embutido
# seria pior que nao ter protecao, porque o adversary conheceria a chave.
# Gere cada uma com: openssl rand -base64 32
# (32 bytes = 256 bits; o indice e HMAC-SHA-256, a cifra e AES-256-GCM).
#
# Perder a chave da cifra torna os dados definitivamente ilegiveis. Guarde em
# secret manager (AWS Secrets Manager, Vault, Azure Key Vault), nunca no git.
locadora.dado-pessoal.indice-chave=${LOCADORA_DADO_PESSOAL_INDICE_CHAVE}
locadora.dado-pessoal.cifra-chave=${LOCADORA_DADO_PESSOAL_CIFRA_CHAVE}

# --- JSON -------------------------------------------------------------------
# Datas ja saem em ISO-8601 (o Boot ja desabilita timestamps por default).
spring.jackson.default-property-inclusion=non_null

# --- Servidor ---------------------------------------------------------------
server.port=${SERVER_PORT:8080}
server.error.include-message=always

# --- CORS -------------------------------------------------------------------
# Origens que podem chamar a API a partir do navegador. Separadas por virgula.
# O padrao cobre as portas de desenvolvimento usuais (5173 = Vite, 3000 = CRA/
# Next). Em producao, sobrescreva com o dominio real: liberar * permitiria que
# qualquer site lesse as respostas da API usando o navegador da vitima.
locadora.cors.origens-permitidas=${LOCADORA_CORS_ORIGENS_PERMITIDAS:http://localhost:5173,http://localhost:3000}
