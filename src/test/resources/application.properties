# ============================================================================
# Configuracao exclusiva dos testes.
#
# O perfil "test" e ativado aqui para impedir que o perfil "dev" (padrao do
# application.yml principal) carregue o application-dev.yml e aponte os testes
# para o PostgreSQL local. Sem isso, o CI falha com ConnectException.
#
# O banco e o H2 em memoria: nenhum teste depende de servico externo.
# As chaves abaixo sao dummies de 32 bytes, validas apenas para teste.
# ============================================================================
spring.profiles.active=test

spring.datasource.url=jdbc:h2:mem:aluguel-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Mantem a saida dos testes legivel.
logging.level.org.hibernate.SQL=warn
logging.level.org.springframework=warn

# Flyway nao roda em teste; o schema e criado pelo Hibernate.
spring.flyway.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

# Chaves LGPD obrigatorias: valores dummy de 32 bytes, somente para teste.
locadora.dado-pessoal.indice-chave=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
locadora.dado-pessoal.cifra-chave=BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB=

# CORS usado pelos testes de acesso do front-end.
locadora.cors.origens-permitidas=http://localhost:5173

# Evita tentativa de checagem de banco externo no Actuator.
management.health.db.enabled=false
