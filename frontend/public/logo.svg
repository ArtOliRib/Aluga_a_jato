<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Veloz">
  <defs>
    <linearGradient id="veloz-corpo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- Corpo: silhueta unica em vez de carro detalhado. Em 32px ainda se le
       como carro, que e o teste que uma logo de marca precisa passar. -->
  <path d="M8 40c0-2 1-4 3-5l3-1 6-9c1-2 3-3 5-3h14c2 0 4 1 5 3l6 9 3 1c2 1 3 3 3 5v5c0 1-1 2-2 2h-3a6 6 0 0 0-12 0H25a6 6 0 0 0-12 0H10c-1 0-2-1-2-2z"
        fill="url(#veloz-corpo)"/>

  <!-- Teto/vidro em prata: separa cabine de carroceria sem precisar de contorno. -->
  <path d="M22 32l5-7c1-1 2-2 4-2h6c2 0 3 1 4 2l5 7z" fill="#E2E8F0"/>

  <!-- Rodas. -->
  <circle cx="19" cy="47" r="5" fill="#0F172A"/>
  <circle cx="19" cy="47" r="2.2" fill="#94A3B8"/>
  <circle cx="45" cy="47" r="5" fill="#0F172A"/>
  <circle cx="45" cy="47" r="2.2" fill="#94A3B8"/>

  <!-- Rastro de movimento: a "velocidade" do nome, sem virar ruido visual. -->
  <path d="M4 30h10M2 36h8" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
</svg>
